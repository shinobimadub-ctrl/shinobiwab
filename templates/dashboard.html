<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>X-VISION | DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt&display=swap');
        body { background: #020205; color: #e2e8f0; font-family: 'Prompt', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-btn.active { border-left: 4px solid #6366f1; background: rgba(99, 102, 241, 0.1); color: white; }
    </style>
</head>
<body class="flex h-screen p-6 gap-6">
    <aside class="w-80 glass rounded-[3rem] p-10 flex flex-col">
        <h2 class="text-2xl font-black mb-16 tracking-tighter" style="font-family:'Orbitron'">X-VISION <span class="text-indigo-500">PRO</span></h2>
        <nav class="flex-1 space-y-3">
            <button onclick="tab('search')" id="t-search" class="nav-btn active w-full p-5 rounded-2xl flex items-center gap-4 text-gray-400"><i class="fa-solid fa-search"></i> SCANNER</button>
            {% if role == 'admin' %}
            <button onclick="tab('admin')" id="t-admin" class="nav-btn w-full p-5 rounded-2xl flex items-center gap-4 text-gray-400"><i class="fa-solid fa-user-shield"></i> ADMIN</button>
            {% endif %}
        </nav>
        <a href="https://shinobiwab.onrender.com/" class="mt-auto py-5 bg-red-500/10 text-red-500 rounded-2xl text-center font-black hover:bg-red-500 hover:text-white transition-all">LOGOUT SYSTEM</a>
    </aside>

    <main class="flex-1 glass rounded-[4rem] p-16 overflow-y-auto">
        <div id="sec-search">
            <div class="flex justify-between items-end mb-12">
                <h1 class="text-5xl font-black uppercase tracking-tighter" style="font-family:'Orbitron'">Central <span class="text-indigo-500">Query</span></h1>
                <div class="flex bg-black/40 p-2 rounded-2xl border border-white/5 gap-2">
                    <button onclick="mode='trans'" class="px-6 py-2 rounded-xl bg-indigo-600 font-bold text-xs">TRANSPORT</button>
                    <button onclick="mode='true'" class="px-6 py-2 rounded-xl text-gray-500 font-bold text-xs">TRUE SFF</button>
                </div>
            </div>
            <div class="relative max-w-4xl bg-white/5 rounded-[2.5rem] border border-white/10 overflow-hidden">
                <input type="text" id="v" placeholder="SCANNING TARGET..." class="w-full p-8 bg-transparent text-2xl outline-none font-bold">
                <button onclick="scan()" class="absolute right-4 top-4 bottom-4 px-12 bg-indigo-600 rounded-[1.8rem] font-black shadow-xl">SCAN</button>
            </div>
            <div id="ld" class="hidden text-center py-20 animate-pulse text-indigo-500">DECRYPTING...</div>
            <div id="res" class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="sec-admin" class="hidden">
            <h1 class="text-4xl font-black mb-10" style="font-family:'Orbitron'">ADMIN PANEL</h1>
            <div class="grid grid-cols-3 gap-8">
                <div class="glass p-8 rounded-3xl space-y-4">
                    <input id="nu" placeholder="USER" class="w-full p-4 bg-white/5 rounded-xl border border-white/10">
                    <input id="np" placeholder="PASS" class="w-full p-4 bg-white/5 rounded-xl border border-white/10">
                    <input id="nd" type="number" placeholder="DAYS" class="w-full p-4 bg-white/5 rounded-xl border border-white/10">
                    <button onclick="adm('add')" class="w-full py-4 bg-indigo-600 rounded-xl font-bold">CREATE</button>
                </div>
                <div id="user-list" class="col-span-2 space-y-4"></div>
            </div>
        </div>
    </main>

    <script>
        let mode = 'trans';
        function tab(t) {
            document.getElementById('sec-search').classList.toggle('hidden', t!=='search');
            document.getElementById('sec-admin').classList.toggle('hidden', t!=='admin');
            if(t==='admin') refresh();
        }
        async function scan() {
            const v = document.getElementById('v').value; if(!v) return;
            document.getElementById('ld').classList.remove('hidden');
            const r = await fetch('/api/search', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({m:mode, v}) });
            const d = await r.json();
            document.getElementById('ld').classList.add('hidden');
            render(d.data);
        }
        function render(data) {
            const res = document.getElementById('res'); res.innerHTML = '';
            if(mode==='trans' && data.logistics?.history?.mobileItems) {
                data.logistics.history.mobileItems.forEach(i => {
                    res.innerHTML += `<div class="glass p-8 rounded-[2.5rem] border-l-4 border-indigo-500">
                        <h4 class="text-xl font-black">${i.name}</h4>
                        <p class="text-indigo-400 font-mono mb-4">${i.mobile}</p>
                        <p class="text-xs text-gray-400">${i.detail_address} ${i.district} ${i.province}</p>
                    </div>`;
                });
            } else if(mode==='true') {
                const rs = data.results?.['response-data'] || data;
                res.innerHTML = `<div class="glass p-10 rounded-[3rem] col-span-full border-l-[12px] border-red-600">
                    <h2 class="text-4xl font-black">${rs.firstname} ${rs.lastname}</h2>
                    <p class="text-gray-400">${rs['id-number']}</p>
                </div>`;
            }
        }
        async function refresh() {
            const r = await fetch('/admin/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({act:'list'}) });
            const d = await r.json();
            document.getElementById('user-list').innerHTML = Object.entries(d.db).map(([u,i])=>`
                <div class="flex justify-between p-6 bg-white/5 rounded-2xl border border-white/5">
                    <p class="font-bold">${u} <span class="text-xs text-gray-500 ml-4">${i.expire}</span></p>
                    <button onclick="adm('del','${u}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>`).join('');
        }
        async function adm(act, u='') {
            const body = { act, u: u||document.getElementById('nu').value, p:document.getElementById('np').value, d:document.getElementById('nd').value };
            await fetch('/admin/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
            refresh();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-VISION PRO | INTEL SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt:wght@300;400;700&display=swap');
        body { background: #020205; color: #e2e8f0; font-family: 'Prompt', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-intel { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(99, 102, 241, 0.2); transition: 0.3s; }
        .card-intel:hover { border-color: #6366f1; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #312e81; border-radius: 10px; }
        .active-nav { background: rgba(99, 102, 241, 0.1); border-left: 4px solid #6366f1; color: white; }
    </style>
</head>
<body>

    <aside class="w-72 glass-panel flex flex-col p-6 z-20">
        <div class="mb-10 text-center">
            <h1 class="cyber-font text-xl font-black italic text-white tracking-widest">X-VISION <span class="text-indigo-500 text-sm">PRO</span></h1>
            <div class="h-1 w-12 bg-indigo-600 mx-auto mt-2 rounded-full"></div>
        </div>

        <nav class="flex-1 space-y-1">
            <button onclick="showTab('scanner')" id="nav-scanner" class="active-nav w-full p-4 rounded-xl flex items-center gap-4 text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-radar"></i> <span class="text-sm font-bold">SCANNER</span>
            </button>
            {% if role == 'admin' %}
            <button onclick="showTab('admin')" id="nav-admin" class="w-full p-4 rounded-xl flex items-center gap-4 text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-shield-halved"></i> <span class="text-sm font-bold">ADMIN PANEL</span>
            </button>
            {% endif %}
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <div class="flex items-center gap-3 mb-6 p-2">
                <div class="w-10 h-10 rounded-full bg-indigo-900 flex items-center justify-center border border-indigo-500 text-white font-bold">{{ user[0].upper() }}</div>
                <div>
                    <p class="text-xs font-black text-white uppercase">{{ user }}</p>
                    <p class="text-[9px] text-indigo-400 font-bold italic">{{ role.upper() }} ACCESS</p>
                </div>
            </div>
            <a href="/logout" class="block w-full py-4 bg-red-600/10 text-red-500 rounded-xl text-center text-xs font-bold hover:bg-red-600 hover:text-white transition-all">SIGN OUT</a>
        </div>
    </aside>

    <main class="flex-1 relative flex flex-col p-8 overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        
        <div id="tab-scanner" class="h-full flex flex-col">
            <div class="flex flex-wrap items-center justify-between mb-8 gap-4">
                <h2 class="cyber-font text-3xl font-black text-white tracking-tighter">INTEL <span class="text-indigo-500">DATABASE</span></h2>
                
                <div class="flex bg-black/50 p-1.5 rounded-2xl border border-white/10 shadow-inner">
                    <button onclick="setMode('trans')" id="m-trans" class="px-6 py-2 rounded-xl bg-indigo-600 text-[10px] font-black text-white transition-all">LOGISTICS</button>
                    <button onclick="setMode('true')" id="m-true" class="px-6 py-2 rounded-xl text-[10px] font-black text-gray-500 transition-all">TRUE SFF</button>
                </div>
            </div>

            <div class="relative max-w-5xl w-full mb-10 group">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-[2.5rem] blur opacity-25 group-focus-within:opacity-50 transition duration-1000"></div>
                <input type="text" id="target-id" placeholder="ป้อนหมายเลขโทรศัพท์ หรือ เลขบัตรประชาชน..." 
                    class="relative w-full p-8 bg-[#0a0a0f] border border-white/10 rounded-[2.5rem] text-xl outline-none focus:border-indigo-500 text-white placeholder:text-gray-700 transition-all pr-48">
                <button onclick="startScan()" class="absolute right-3 top-3 bottom-3 px-12 bg-indigo-600 hover:bg-indigo-500 rounded-[1.8rem] font-black text-white transition-all active:scale-95 shadow-xl">
                    SCAN
                </button>
            </div>

            <div id="loading" class="hidden text-center py-20 animate-pulse">
                <i class="fa-solid fa-atom fa-spin text-5xl text-indigo-500 mb-4"></i>
                <p class="cyber-font text-sm text-indigo-400">SEARCHING SECURE NODES...</p>
            </div>

            <div id="result-grid" class="flex-1 overflow-y-auto custom-scroll pr-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 pb-10">
                </div>
        </div>

        <div id="tab-admin" class="hidden h-full">
            <h2 class="cyber-font text-3xl font-black text-white mb-10">SYSTEM <span class="text-indigo-500">CONTROL</span></h2>
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                <div class="glass-panel p-8 rounded-[2rem] h-fit">
                    <h3 class="font-bold text-indigo-400 mb-6 flex items-center gap-2"><i class="fa-solid fa-user-plus"></i> ADD OPERATOR</h3>
                    <div class="space-y-4">
                        <input id="u-add" placeholder="Username" class="w-full p-4 bg-black/40 rounded-xl border border-white/5 outline-none focus:border-indigo-500">
                        <input id="p-add" placeholder="Password" class="w-full p-4 bg-black/40 rounded-xl border border-white/5 outline-none focus:border-indigo-500">
                        <input id="d-add" type="number" placeholder="Days (Expire)" class="w-full p-4 bg-black/40 rounded-xl border border-white/5 outline-none focus:border-indigo-500">
                        <button onclick="manage('add')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-black transition-all">GRANT ACCESS</button>
                    </div>
                </div>
                <div id="user-display" class="xl:col-span-2 space-y-4 overflow-y-auto custom-scroll max-h-[600px]">
                    </div>
            </div>
        </div>

    </main>

    <script>
        let searchMode = 'trans';

        function showTab(t) {
            document.getElementById('tab-scanner').classList.toggle('hidden', t !== 'scanner');
            document.getElementById('tab-admin').classList.toggle('hidden', t !== 'admin');
            document.getElementById('nav-scanner').className = t === 'scanner' ? 'active-nav w-full p-4 rounded-xl flex items-center gap-4 text-white' : 'w-full p-4 rounded-xl flex items-center gap-4 text-gray-400';
            document.getElementById('nav-admin').className = t === 'admin' ? 'active-nav w-full p-4 rounded-xl flex items-center gap-4 text-white' : 'w-full p-4 rounded-xl flex items-center gap-4 text-gray-400';
            if(t === 'admin') fetchUsers();
        }

        function setMode(m) {
            searchMode = m;
            document.getElementById('m-trans').className = m === 'trans' ? 'px-6 py-2 rounded-xl bg-indigo-600 text-[10px] font-black text-white transition-all' : 'px-6 py-2 rounded-xl text-[10px] font-black text-gray-500 transition-all';
            document.getElementById('m-true').className = m === 'true' ? 'px-6 py-2 rounded-xl bg-indigo-600 text-[10px] font-black text-white transition-all' : 'px-6 py-2 rounded-xl text-[10px] font-black text-gray-500 transition-all';
        }

        async function startScan() {
            const val = document.getElementById('target-id').value;
            if(!val) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result-grid').innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({m: searchMode, v: val})
                });
                const result = await response.json();
                document.getElementById('loading').classList.add('hidden');
                
                if(result.status === 'ok') renderIntel(result.data);
                else alert("ACCESS DENIED OR API ERROR");
            } catch (err) {
                document.getElementById('loading').classList.add('hidden');
                alert("SERVER CONNECTION LOST");
            }
        }

        function renderIntel(data) {
            const grid = document.getElementById('result-grid');
            let html = '';

            // --- กรณีโหมด LOGISTICS (ดึงจาก mobileItems) ---
            if (searchMode === 'trans' && data.logistics?.history?.mobileItems) {
                data.logistics.history.mobileItems.forEach(item => {
                    html += `
                    <div class="card-intel p-8 rounded-[2rem] animate-fadeIn relative overflow-hidden group">
                        <div class="absolute top-0 right-0 p-4 bg-indigo-600/10 rounded-bl-3xl">
                            <i class="fa-solid fa-box-open text-indigo-500"></i>
                        </div>
                        <p class="text-[10px] text-indigo-400 font-black mb-1 italic">SHIPMILE HISTORY</p>
                        <h3 class="text-2xl font-bold text-white mb-2">${item.name}</h3>
                        <p class="text-indigo-500 font-mono font-bold mb-6 italic"><i class="fa-solid fa-phone mr-2"></i>${item.mobile}</p>
                        
                        <div class="grid grid-cols-1 gap-3 text-sm">
                            <div class="p-3 bg-black/30 rounded-xl border border-white/5">
                                <span class="text-[9px] text-gray-500 block mb-1 uppercase font-bold">Address</span>
                                <p class="text-gray-300 leading-relaxed">${item.detail_address} ต.${item.district} อ.${item.city} จ.${item.province} ${item.postal_code}</p>
                            </div>
                            <div class="flex gap-2">
                                <div class="flex-1 p-3 bg-black/30 rounded-xl border border-white/5">
                                    <span class="text-[9px] text-gray-500 block mb-1 uppercase font-bold">Created At</span>
                                    <p class="text-gray-300 text-xs">${item.created_at}</p>
                                </div>
                                <div class="flex-1 p-3 bg-black/30 rounded-xl border border-white/5">
                                    <span class="text-[9px] text-gray-500 block mb-1 uppercase font-bold">Source ID</span>
                                    <p class="text-gray-300 text-xs">#${item.id}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
                });
            } 
            // --- กรณีโหมด TRUE SFF (โครงสร้างพื้นฐาน) ---
            else if (searchMode === 'true' && data.results) {
                const rs = data.results['response-data'] || data.results;
                html = `
                <div class="card-intel p-10 rounded-[2.5rem] col-span-full border-l-8 border-indigo-600">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-indigo-400 font-black text-xs italic mb-2">TRUE SFF INTEL REPORT</p>
                            <h2 class="text-4xl font-black text-white italic">${rs.firstname || 'NAME'} ${rs.lastname || ''}</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">ID NUMBER</p>
                            <p class="text-xl text-white font-mono font-bold">${rs['id-number'] || 'N/A'}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Birth Date</p>
                            <p class="text-white text-sm font-bold">${rs.birthdate || '-'}</p>
                        </div>
                        <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Status</p>
                            <p class="text-green-500 text-sm font-bold">ACTIVE</p>
                        </div>
                        <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Province</p>
                            <p class="text-white text-sm font-bold">${rs['address-list']?.CUSTOMER_ADDRESS?.province || '-'}</p>
                        </div>
                        <div class="p-4 bg-black/40 rounded-2xl border border-white/5">
                            <p class="text-[9px] text-gray-500 font-bold uppercase mb-1">Intelligence</p>
                            <p class="text-indigo-400 text-sm font-bold italic">VERIFIED</p>
                        </div>
                    </div>
                </div>`;
            } else {
                html = `<div class="col-span-full text-center py-20 bg-white/5 rounded-[3rem] border border-dashed border-white/10">
                            <i class="fa-solid fa-database text-4xl text-gray-700 mb-4"></i>
                            <p class="text-gray-500 italic font-bold uppercase tracking-widest">-- Data Not Encrypted In Current Database --</p>
                        </div>`;
            }
            grid.innerHTML = html;
        }

        // Admin Functions
        async function fetchUsers() {
            const r = await fetch('/admin/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({act: 'list'}) });
            const d = await r.json();
            document.getElementById('user-display').innerHTML = Object.entries(d.db).map(([u, i]) => `
                <div class="flex items-center justify-between p-6 bg-white/5 rounded-2xl border border-white/5 hover:bg-white/10 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-indigo-600/20 flex items-center justify-center text-indigo-500 font-black italic">ID</div>
                        <div>
                            <p class="text-white font-black uppercase text-sm tracking-widest">${u}</p>
                            <p class="text-[10px] text-gray-500 font-bold">PASSWORD: <span class="text-indigo-400 font-mono">${i.password}</span> | EXPIRE: ${i.expire}</p>
                        </div>
                    </div>
                    ${u !== 'shinobi2023' ? `<button onclick="manage('del', '${u}')" class="w-10 h-10 rounded-xl bg-red-600/10 text-red-500 flex items-center justify-center hover:bg-red-600 hover:text-white transition-all"><i class="fa-solid fa-trash-can"></i></button>` : '<span class="text-[10px] text-indigo-500 font-black px-4 py-2 bg-indigo-500/10 rounded-full italic uppercase">Root Admin</span>'}
                </div>`).join('');
        }

        async function manage(act, u = '') {
            const payload = {
                act,
                u: u || document.getElementById('u-add').value,
                p: document.getElementById('p-add').value,
                d: document.getElementById('d-add').value
            };
            await fetch('/admin/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            fetchUsers();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>X-VISION | COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt:wght@300;400;700&display=swap');
        body { background: #020205; color: #e2e8f0; font-family: 'Prompt', sans-serif; overflow: hidden; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-btn.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), transparent);
            border-left: 4px solid #6366f1;
            color: #fff;
        }
        .search-box:focus-within {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .res-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .res-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.05); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen p-6 gap-6">

    <aside class="w-80 glass rounded-[3.5rem] p-10 flex flex-col shadow-2xl relative">
        <div class="mb-16">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-eye text-white"></i></div>
                <h2 class="cyber-font text-2xl font-black italic tracking-tighter">X-VISION</h2>
            </div>
            <div class="h-1 w-20 bg-indigo-600 rounded-full"></div>
        </div>

        <nav class="flex-1 space-y-3">
            <button onclick="switchTab('search')" id="t-search" class="sidebar-btn active w-full flex p-5 rounded-2xl items-center text-lg font-medium transition-all">
                <i class="fa-solid fa-tower-broadcast mr-4 text-indigo-500"></i> SCANNER
            </button>
            {% if role == 'admin' %}
            <button onclick="switchTab('admin')" id="t-admin" class="sidebar-btn w-full flex p-5 rounded-2xl items-center text-lg text-gray-500 transition-all">
                <i class="fa-solid fa-shield-halved mr-4"></i> MANAGEMENT
            </button>
            {% endif %}
        </nav>

        <div class="mt-auto space-y-4">
            <div class="bg-white/5 p-5 rounded-[2rem] border border-white/5">
                <p class="text-[9px] text-gray-500 uppercase tracking-widest mb-1">Active Operator</p>
                <p class="text-indigo-400 font-bold truncate">{{ user }}</p>
            </div>
            <a href="https://shinobiwab.onrender.com/" class="block w-full py-5 rounded-[2rem] bg-red-500/10 text-red-500 text-center font-black hover:bg-red-500 hover:text-white transition-all shadow-lg">
                SYSTEM LOGOUT
            </a>
        </div>
    </aside>

    <main class="flex-1 glass rounded-[4rem] p-16 overflow-y-auto relative">
        <div id="sec-search">
            <div class="flex justify-between items-end mb-12">
                <div>
                    <h1 class="text-6xl font-black cyber-font uppercase tracking-tighter leading-none mb-4">Intelligence<br><span class="text-indigo-500">Database</span></h1>
                    <p class="text-gray-500 font-medium">เข้าถึงฐานข้อมูลส่วนกลางแบบเรียลไทม์</p>
                </div>
                <div class="flex bg-black/40 p-2 rounded-3xl border border-white/5 gap-2">
                    <button onclick="m='trans'" id="m-trans" class="px-8 py-3 rounded-2xl bg-indigo-600 font-bold text-xs transition-all shadow-lg">TRANSPORT</button>
                    <button onclick="m='true'" id="m-true" class="px-8 py-3 rounded-2xl text-gray-500 font-bold text-xs transition-all">TRUE SFF</button>
                    <button onclick="m='dopa'" id="m-dopa" class="px-8 py-3 rounded-2xl text-gray-500 font-bold text-xs transition-all">DOPA</button>
                </div>
            </div>

            <div class="search-box relative max-w-4xl border border-white/10 rounded-[2.5rem] overflow-hidden transition-all bg-white/5">
                <input type="text" id="v" placeholder="ป้อนหมายเลขบัตรหรือเบอร์โทร..." class="w-full bg-transparent p-9 pr-48 text-2xl outline-none text-white cyber-font">
                <button onclick="doSearch()" class="absolute right-4 top-4 bottom-4 bg-indigo-600 px-12 rounded-[1.8rem] font-black text-xl hover:bg-indigo-500 active:scale-95 transition-all shadow-xl">
                    SCAN NOW
                </button>
            </div>

            <div id="ld" class="hidden py-20 text-center">
                <div class="inline-block w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 cyber-font text-indigo-500 animate-pulse">DECRYPTING DATA...</p>
            </div>

            <div id="res" class="mt-16 grid grid-cols-1 lg:grid-cols-2 gap-8">
                </div>
        </div>

        <div id="sec-admin" class="hidden">
            <h1 class="text-5xl font-black cyber-font mb-12">USER CONTROL</h1>
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-10">
                <div class="glass p-10 rounded-[3rem] border-t-8 border-indigo-600">
                    <h3 class="text-xl font-bold mb-8">สร้างรหัสการเข้าถึง</h3>
                    <div class="space-y-4">
                        <input type="text" id="nu" placeholder="USER ID" class="w-full bg-white/5 p-5 rounded-2xl border border-white/10 outline-none focus:border-indigo-500">
                        <input type="text" id="np" placeholder="PASSWORD" class="w-full bg-white/5 p-5 rounded-2xl border border-white/10 outline-none focus:border-indigo-500">
                        <input type="number" id="nd" placeholder="จำนวนวันใช้งาน" class="w-full bg-white/5 p-5 rounded-2xl border border-white/10 outline-none focus:border-indigo-500">
                        <button onclick="adm('add')" class="w-full py-5 bg-indigo-600 rounded-2xl font-black text-lg mt-4 shadow-lg shadow-indigo-600/30">GENERATE USER</button>
                    </div>
                </div>
                <div class="xl:col-span-2 glass p-10 rounded-[3rem] overflow-y-auto max-h-[600px]" id="user-list">
                    </div>
            </div>
        </div>
    </main>

    <script>
        let m = 'trans';
        function switchTab(t) {
            document.getElementById('sec-search').classList.toggle('hidden', t !== 'search');
            document.getElementById('sec-admin').classList.toggle('hidden', t !== 'admin');
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.id === 't-'+t));
            if(t==='admin') refreshAdmin();
        }

        async function doSearch() {
            const v = document.getElementById('v').value;
            if(!v) return;
            const ld = document.getElementById('ld');
            const resDiv = document.getElementById('res');
            ld.classList.remove('hidden');
            resDiv.innerHTML = '';

            try {
                const r = await fetch('/api/search', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({m, v})
                });
                const res = await r.json();
                ld.classList.add('hidden');
                renderData(res.data);
            } catch {
                ld.classList.add('hidden');
                resDiv.innerHTML = '<p class="text-red-500">ERROR: CONNECTION LOST</p>';
            }
        }

        function renderData(data) {
            const resDiv = document.getElementById('res');
            let h = '';
            if (m === 'trans' && data.logistics?.history?.mobileItems) {
                data.logistics.history.mobileItems.forEach(item => {
                    h += `
                    <div class="res-card glass p-8 rounded-[2.5rem] border-l-4 border-indigo-500 shadow-xl">
                        <div class="flex justify-between items-start mb-4">
                            <p class="text-[10px] text-indigo-400 font-black tracking-widest uppercase">Shipmile Logistics</p>
                            <span class="text-[10px] bg-white/5 px-3 py-1 rounded-full text-gray-400">${item.created_at}</span>
                        </div>
                        <h4 class="text-2xl font-black mb-1">${item.name}</h4>
                        <p class="text-indigo-500 font-mono text-lg mb-6 tracking-tighter">${item.mobile}</p>
                        <div class="bg-black/20 p-5 rounded-2xl">
                            <p class="text-xs text-gray-400 leading-relaxed italic">
                                <i class="fa-solid fa-location-dot mr-2 text-indigo-500"></i>
                                ${item.detail_address} ${item.district} ${item.city} ${item.province} ${item.postal_code}
                            </p>
                        </div>
                    </div>`;
                });
            } else {
                h = '<div class="col-span-full text-center py-20 text-gray-600 cyber-font uppercase tracking-widest">No Intelligence Data Found</div>';
            }
            resDiv.innerHTML = h;
        }

        async function adm(act, u='') {
            const body = { act, u: u || document.getElementById('nu').value, p: document.getElementById('np').value, d: document.getElementById('nd').value };
            await fetch('/admin/action', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
            refreshAdmin();
        }

        async function refreshAdmin() {
            const res = await (await fetch('/admin/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({act:'list'})})).json();
            document.getElementById('user-list').innerHTML = Object.entries(res.db).map(([u, i]) => `
                <div class="flex justify-between items-center p-6 bg-white/5 border border-white/5 rounded-3xl mb-4 hover:border-indigo-500 transition-all">
                    <div>
                        <p class="text-xl font-bold text-white">${u}</p>
                        <p class="text-xs text-indigo-400 font-mono">Password: ${i.password} | Exp: ${i.expire}</p>
                    </div>
                    <button onclick="adm('del', '${u}')" class="w-12 h-12 rounded-2xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>

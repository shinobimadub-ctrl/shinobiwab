<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>X-VISION PRO | CORE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt:wght@300;400;700&display=swap');
        
        body { 
            background: url('https://img2.pic.in.th/622387587_122213646362311703_8906792467822727511_n.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e2e8f0; font-family: 'Prompt', sans-serif; overflow: hidden; height: 100vh;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: -1;
        }

        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .tab-btn.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.3), transparent); border-left: 4px solid #6366f1; color: white; }
        .mode-btn.active { background: #6366f1 !important; color: white !important; box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        .res-card { animation: zoomIn 0.3s ease-out; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="flex p-5 gap-5">

    <aside class="w-80 glass rounded-[3rem] p-8 flex flex-col shadow-2xl">
        <div class="flex items-center gap-4 mb-14">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center animate-pulse shadow-lg shadow-indigo-500/50">
                <i class="fa-solid fa-bolt-lightning text-white text-2xl"></i>
            </div>
            <div>
                <h2 class="cyber-font text-xl font-black italic">X-VISION<span class="text-indigo-500 font-black">PRO</span></h2>
                <p class="text-[8px] text-gray-400 tracking-[0.4em] font-bold uppercase">System v3.0</p>
            </div>
        </div>

        <nav class="flex-1 space-y-2 font-bold">
            <button onclick="switchTab('search')" id="t-search" class="tab-btn active w-full flex p-5 rounded-2xl items-center hover:bg-white/5 transition-all text-sm uppercase tracking-widest">
                <i class="fa-solid fa-satellite-dish mr-4"></i> ค้นหาฐานข้อมูล
            </button>
            <button onclick="switchTab('admin')" id="t-admin" class="tab-btn w-full flex p-5 rounded-2xl items-center text-gray-400 hover:bg-white/5 transition-all text-sm uppercase tracking-widest">
                <i class="fa-solid fa-user-shield mr-4"></i> จัดการผู้ใช้
            </button>
        </nav>

        <div class="mt-auto space-y-4">
            <div class="p-5 bg-black/40 rounded-3xl border border-white/5">
                <p class="text-[9px] text-indigo-400 font-bold mb-1 uppercase tracking-widest italic">User Node</p>
                <p class="text-sm font-black text-white cyber-font truncate">{{ user }}</p>
            </div>
            <button class="w-full py-4 rounded-2xl bg-red-600/20 text-red-500 font-black hover:bg-red-600 hover:text-white transition-all text-xs tracking-widest uppercase">Terminate Session</button>
        </div>
    </aside>

    <main class="flex-1 glass rounded-[3rem] p-12 overflow-y-auto relative">
        <div id="sec-search">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-5xl font-black cyber-font mb-2 uppercase italic tracking-tighter">Query <span class="text-indigo-500">Center</span></h1>
                    <p class="text-gray-400 italic">Connected to X-Core Shipmile & DOPA Nodes</p>
                </div>
                <div class="flex bg-black/60 p-1.5 rounded-2xl border border-white/10 gap-1">
                    <button onclick="m='dopa'" id="m-dopa" class="mode-btn px-6 py-2 rounded-xl text-gray-500 text-[10px] font-black transition-all">DOPA</button>
                    <button onclick="m='trans'" id="m-trans" class="mode-btn active px-6 py-2 rounded-xl text-[10px] font-black transition-all">TRANSPORT</button>
                    <button onclick="m='true'" id="m-true" class="mode-btn px-6 py-2 rounded-xl text-gray-500 text-[10px] font-black transition-all">TRUE SFF</button>
                </div>
            </div>

            <div class="relative max-w-5xl mb-12">
                <input type="text" id="v" placeholder="กรอกชื่อ/เบอร์โทร เพื่อเริ่มการสแกน..." 
                       class="w-full bg-black/60 border border-white/10 p-8 pr-56 rounded-[2.5rem] text-2xl cyber-font outline-none focus:border-indigo-500 transition-all shadow-2xl text-white">
                <button onclick="doSearch()" class="absolute right-4 top-4 bottom-4 bg-indigo-600 hover:bg-indigo-500 px-12 rounded-[1.8rem] font-black text-xl cyber-font transition-all active:scale-95 shadow-lg shadow-indigo-600/30">SCAN</button>
            </div>

            <div id="ld" class="hidden text-center py-20">
                <div class="w-16 h-16 border-4 border-t-indigo-500 border-white/10 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="cyber-font text-indigo-500 text-xs animate-pulse">Decrypting Data Streams...</p>
            </div>
            
            <div id="res" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </main>

    <script>
        let m = 'trans'; // เริ่มต้นที่โหมด Transport ตามที่คุณส่ง API มา

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.mode-btn').forEach(b => { b.classList.remove('active'); b.classList.add('text-gray-500'); });
                this.classList.add('active'); this.classList.remove('text-gray-500');
                m = this.id.split('-')[1];
            }
        });

        async function doSearch() {
            const val = document.getElementById('v').value; if(!val) return;
            document.getElementById('ld').classList.remove('hidden');
            document.getElementById('res').innerHTML = '';
            
            try {
                const r = await fetch('/api/search', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({m, v:val})
                });
                const res = await r.json();
                document.getElementById('ld').classList.add('hidden');
                renderData(res);
            } catch(e) {
                document.getElementById('ld').classList.add('hidden');
                alert('API Connection Failed');
            }
        }

        function renderData(res) {
            const resDiv = document.getElementById('res');
            let h = '';

            // แสดงผลสำหรับโหมด Logistics/Transport (ข้อมูลที่คุณส่งมา)
            if (m === 'trans' && res.logistics && res.logistics.history.mobileItems) {
                res.logistics.history.mobileItems.forEach(item => {
                    h += `
                    <div class="res-card p-8 rounded-[2.5rem] border-t-4 border-indigo-600 shadow-2xl backdrop-blur-md">
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-[10px] bg-indigo-600 px-3 py-1 rounded-full font-black uppercase tracking-tighter">Logistics Record</span>
                            <span class="text-[9px] text-gray-500 font-bold uppercase">${item.created_at}</span>
                        </div>
                        <h2 class="text-3xl font-black text-white mb-1 italic">${item.name}</h2>
                        <p class="text-xl text-indigo-400 font-mono tracking-widest font-bold mb-4 underline decoration-white/10">${item.mobile}</p>
                        
                        <div class="space-y-3 bg-black/40 p-5 rounded-2xl border border-white/5">
                            <p class="text-xs text-gray-300 leading-relaxed font-bold italic uppercase">
                                <i class="fa-solid fa-map-location-dot mr-2 text-indigo-500"></i>
                                ${item.detail_address} ต.${item.district} อ.${item.city} จ.${item.province} ${item.postal_code}
                            </p>
                            <div class="flex gap-2">
                                <span class="text-[9px] border border-white/10 px-2 py-1 rounded-lg text-gray-500">Source: ${res.logistics.source}</span>
                                <span class="text-[9px] border border-white/10 px-2 py-1 rounded-lg text-gray-500">Node: ${item.store_id}</span>
                            </div>
                        </div>
                    </div>`;
                });
            } else {
                h = '<p class="col-span-full text-center py-20 text-gray-600 font-black cyber-font italic">-- DATA STREAM NOT FOUND --</p>';
            }
            resDiv.innerHTML = h;
        }

        function switchTab(t) {
            // Logic เปลี่ยน Tab
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Login | X-VISION PRO</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt:wght@300;400;700&display=swap');

body{
    font-family:'Prompt',sans-serif;
    min-height:100vh;
    background:url("https://img2.pic.in.th/622387587_122213646362311703_8906792467822727511_n.jpg")
        center/cover fixed no-repeat;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,255,.3), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,0,255,.3), transparent 40%),
        rgba(0,0,0,.7);
    z-index:-2;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    backdrop-filter:blur(6px);
    z-index:-1;
}
.glass{
    background:rgba(10,15,30,.65);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 30px rgba(0,255,255,.25);
}
.neon{
    font-family:'Orbitron',sans-serif;
    text-shadow:0 0 10px cyan,0 0 25px magenta;
}
</style>
</head>

<body class="flex items-center justify-center">

<form class="glass p-12 rounded-3xl w-full max-w-md">
    <h1 class="neon text-4xl font-black text-center mb-8">
        X-VISION PRO
    </h1>

    <input placeholder="Username"
        class="w-full mb-4 p-4 rounded-xl bg-black/60 border border-white/10 text-white outline-none">

    <input type="password" placeholder="Password"
        class="w-full mb-6 p-4 rounded-xl bg-black/60 border border-white/10 text-white outline-none">

    <button class="w-full py-4 rounded-xl bg-indigo-600 font-black hover:bg-indigo-500">
        LOGIN
    </button>
</form>

</body>
</html>

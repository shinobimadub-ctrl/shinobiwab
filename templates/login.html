<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>X-VISION | LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Prompt&display=swap');
        body { background: #050508; font-family: 'Prompt', sans-serif; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .captcha { letter-spacing: 10px; font-family: 'Orbitron'; background: #111; color: #6366f1; }
    </style>
</head>
<body>
    <div class="glass p-12 rounded-[3rem] w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-black text-center mb-10 tracking-tighter" style="font-family:'Orbitron'">X-VISION</h1>
        <div class="space-y-6">
            <input type="text" id="u" placeholder="USERNAME" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500">
            <input type="password" id="p" placeholder="PASSWORD" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-indigo-500">
            <div class="flex gap-4 items-center">
                <div id="cp-code" class="captcha flex-1 p-4 rounded-2xl text-center font-bold text-xl"></div>
                <button onclick="gen()" class="text-gray-500"><i class="fa-solid fa-sync"></i></button>
            </div>
            <input type="text" id="cp-in" placeholder="CAPTCHA" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl text-center font-bold">
            <button onclick="auth()" class="w-full py-5 bg-indigo-600 rounded-2xl font-black shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 transition-all">LOGIN SYSTEM</button>
        </div>
        <p id="err" class="text-red-500 text-center mt-4 text-xs font-bold"></p>
    </div>
    <script>
        let code = "";
        function gen() { code = Math.floor(1000 + Math.random() * 9000).toString(); document.getElementById('cp-code').innerText = code; }
        async function auth() {
            const u = document.getElementById('u').value, p = document.getElementById('p').value, ci = document.getElementById('cp-in').value;
            if(ci !== code) { alert("Captcha Invalid"); gen(); return; }
            const r = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({u, p}) });
            const d = await r.json();
            if(d.status === 'ok') location.href='/dashboard'; else document.getElementById('err').innerText = d.m;
        }
        window.onload = gen;
    </script>
</body>
</html>
